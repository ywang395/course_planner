spring.application.name=course_planner
server.port=${PORT:8080}

# Local defaults; Render supplies DB_* from the managed database (see render.yaml).
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD environment variables still override these.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:courseplanner}
spring.datasource.username=${DB_USER:Lin}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
